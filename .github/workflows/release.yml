name: CI & Release

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  ci-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build userscript
        run: npm run build

      - name: Run tests
        continue-on-error: true
        run: npm test

      - name: Publish / Update Latest Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          body: |
            Automated build of **AlloCiné Rating on Trakt**.
            
            Install or update in **Tampermonkey** or **Violentmonkey**:
            https://github.com/noeRls/trackt-allocine-rating/releases/latest/download/allocine-rating-on-trakt.user.js
          files: |
            dist/allocine-rating-on-trakt.user.js
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

